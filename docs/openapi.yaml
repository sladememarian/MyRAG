openapi: 3.0.3
info:
  title: Document QA (RAG) API
  version: 1.0.0
  description: Upload .docx documents, ask questions and read the question/answer
    history. Authenticate with a session (admin login) or a DRF token.
paths:
  /api/ask/:
    post:
      operationId: ask_create
      description: Retrieves relevant document chunks, asks the configured OpenRouter
        model, stores the question/answer in the history and returns the answer with
        sources.
      summary: Ask a question
      tags:
      - ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
          description: ''
  /api/documents/:
    get:
      operationId: documents_list
      description: |-
        List, retrieve, upload, update and delete documents.

        Upload/update trigger extraction + indexing; delete removes the chunks.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - documents
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentList'
          description: ''
    post:
      operationId: documents_create
      description: |-
        List, retrieve, upload, update and delete documents.

        Upload/update trigger extraction + indexing; delete removes the chunks.
      tags:
      - documents
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/documents/{id}/:
    get:
      operationId: documents_retrieve
      description: |-
        List, retrieve, upload, update and delete documents.

        Upload/update trigger extraction + indexing; delete removes the chunks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Document.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
    put:
      operationId: documents_update
      description: |-
        List, retrieve, upload, update and delete documents.

        Upload/update trigger extraction + indexing; delete removes the chunks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Document.
        required: true
      tags:
      - documents
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
    patch:
      operationId: documents_partial_update
      description: |-
        List, retrieve, upload, update and delete documents.

        Upload/update trigger extraction + indexing; delete removes the chunks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Document.
        required: true
      tags:
      - documents
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDocumentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDocumentRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDocumentRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
    delete:
      operationId: documents_destroy
      description: |-
        List, retrieve, upload, update and delete documents.

        Upload/update trigger extraction + indexing; delete removes the chunks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Document.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/history/:
    get:
      operationId: history_list
      description: Paginated list and detail of the current user's questions and answers.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - history
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueryList'
          description: ''
  /api/history/{id}/:
    get:
      operationId: history_retrieve
      description: Paginated list and detail of the current user's questions and answers.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Query.
        required: true
      tags:
      - history
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
          description: ''
components:
  schemas:
    AskRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 2000
      required:
      - question
    AskResponse:
      type: object
      properties:
        query_id:
          type: integer
        answer:
          type: string
        sources: {}
        model_name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        detail:
          type: string
      required:
      - answer
      - created_at
      - model_name
      - query_id
      - sources
      - status
    Document:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        file:
          type: string
          format: uri
        full_text:
          type: string
          readOnly: true
        indexed:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - file
      - full_text
      - id
      - indexed
      - title
      - updated_at
    DocumentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        file:
          type: string
          format: binary
      required:
      - file
      - title
    FailureKindEnum:
      enum:
      - no_content
      - llm
      - other
      type: string
      description: |-
        * `no_content` - No relevant content
        * `llm` - Language model error
        * `other` - Other error
    PaginatedDocumentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Document'
    PaginatedQueryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Query'
    PatchedDocumentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        file:
          type: string
          format: binary
    Query:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: string
          readOnly: true
        answer:
          type: string
          readOnly: true
        sources:
          readOnly: true
        model_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        failure_kind:
          allOf:
          - $ref: '#/components/schemas/FailureKindEnum'
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer
      - created_at
      - error_message
      - failure_kind
      - id
      - model_name
      - question
      - sources
      - status
    StatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - OK
        * `error` - Error
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
